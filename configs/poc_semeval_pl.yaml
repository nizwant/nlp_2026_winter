# First proof of concept: Bielik on the SemEval PL pilot subset (219 train paragraphs).
#
# Serve the model with llama.cpp's server (GPU build), for example:
#   llama-server -hf speakleash/Bielik-11B-v3.0-Instruct-GGUF:Q4_K_M \
#       --host 127.0.0.1 --port 8080 -ngl 99 -c 12288 -np 4 --no-webui
#   (-c is shared by the -np slots: 12288 / 4 = 3072 tokens per request, enough for a paragraph prompt)
# then:
#   python -m routing.run configs/poc_semeval_pl.yaml
#   python -m routing.analyze outputs/runs/poc_semeval_pl_bielik
#
# Do not point this at Ollama's /v1 endpoint for real runs. Checked on 15 Nov 2026: it applies a
# repetition penalty of 1.1 that cannot be changed per request and that flips decisions away from the
# repeated "0", and it returns the keys in alphabetical order instead of the order below.

run_name: poc_semeval_pl_bielik
source: semeval_pl
role: pilot
prompt: p1

engine:
  kind: openai                      # any OpenAI-compatible server
  server: llama.cpp                 # recorded in the log
  base_url: http://127.0.0.1:8080/v1
  model: Bielik-11B-v3.0-Instruct
  quantization: Q4_K_M
  top_logprobs: 10
  # Sampler settings are pinned so that nothing but temperature and top-p shapes the samples.
  # For a model that reasons before answering, also switch that off on the server
  # (llama-server --reasoning-budget 0); the answer must be the JSON object and nothing else.
  extra_body:
    repeat_penalty: 1.0
    top_k: 0
    min_p: 0.0
    cache_prompt: true

n_samples: 5
temperature: 0.7
top_p: 0.95
base_seed: 1000
greedy: true
max_concurrency: 4
