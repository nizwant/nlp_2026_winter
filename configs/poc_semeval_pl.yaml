# Proof of concept: Bielik on the SemEval PL pilot subset (219 train paragraphs from 11 articles).
#
#   scripts/serve_vllm.sh bielik                                   # in the `vllm` environment
#   python -m routing.run configs/poc_semeval_pl.yaml              # in the `nlp-routing` environment
#   python -m routing.analyze outputs/runs/poc_semeval_pl_bielik
#
# Do not point this at Ollama's /v1 endpoint. Checked on 15 Nov 2026: it applies a repetition
# penalty of 1.1 that cannot be changed per request and that flips decisions away from the
# repeated "0", and it returns the keys in alphabetical order instead of the order of the schema.

run_name: poc_semeval_pl_bielik
source: semeval_pl
role: pilot
prompt: p1

engine:
  kind: openai                      # any OpenAI-compatible server
  server: vLLM 0.33.0               # recorded in the log
  base_url: http://127.0.0.1:8000/v1
  model: Bielik-11B-v3.0-Instruct
  quantization: AWQ 4-bit, speakleash/Bielik-11B-v3.0-Instruct-awq @ 0de6dd1
  top_logprobs: 10                  # alternatives per generated token (greedy pass)
  prompt_logprobs: 20               # alternatives per prompt token (teacher-forced scoring)
  # Sampler settings are pinned so that nothing but temperature and top-p shapes the samples.
  extra_body:
    repetition_penalty: 1.0
    top_k: 0
    min_p: 0.0

n_samples: 5
n_batches: 3          # three independent batches of five runs; batch 0 is the main one
temperature: 0.7
top_p: 0.95
base_seed: 1000
greedy: true          # one run at temperature 0 with the probability of every decision
score_voted: true     # teacher-forced log-probability of the majority vote
verbal: true          # stated confidence in the majority vote
verbal_greedy: true   # stated confidence in the greedy answer where it differs from the vote
max_concurrency: 16
