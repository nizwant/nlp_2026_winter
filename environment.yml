# Analysis and client environment. The model server (vLLM) runs in its own environment or container.
#   mamba env create -f environment.yml
#   conda activate nlp-routing
#   pip install -e .
# Versions are the ones the reported results were produced with.
name: nlp-routing
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.5.4
  - pandas=3.1.1
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - matplotlib=3.11.2
  - pyyaml=6.0.3
  - openai=3.51.0
  - tqdm=4.70.1
  - pytest=9.2.0
  - ipykernel=7.4.0
  - nbconvert=7.17.2
  - pip
